services:
  - type: web
    name: ignis-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend/ignis_adk
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: IGNIS_PROVIDER_ORDER
        value: gemini,groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/openai/gpt-oss-20b
      - key: GROQ_FAST_MODEL
        value: groq/openai/gpt-oss-20b
      - key: NASA_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: IGNIS_DENSE
        value: "off"

